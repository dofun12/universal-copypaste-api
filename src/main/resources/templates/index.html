<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout :: head('Home')}"></head>
<body class="d-flex flex-column min-vh-100 bg-body-tertiary">
<div th:replace="~{layout :: navbar}"></div>

<main class="container flex-grow-1 py-4 py-md-5" style="max-width: 480px;">
    <div class="text-center mb-4">
        <h1 class="h3 fw-bold">Share text between devices</h1>
        <p class="text-muted">Start a chat on one device, join it with the code on another.</p>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-body text-center">
            <h2 class="h6 text-uppercase text-muted mb-3">Start a new chat</h2>
            <button id="create-chat-btn" type="button" class="btn btn-primary btn-lg w-100">
                Create chat code
            </button>
            <div id="create-error" class="text-danger small mt-2 d-none"></div>
        </div>
    </div>

    <div id="created-chat-card" class="card shadow-sm mb-4 d-none">
        <div class="card-body text-center">
            <h2 class="h6 text-uppercase text-muted mb-2">Chat created</h2>
            <div id="created-chat-code" class="display-6 fw-bold font-monospace mb-2">AYBDC</div>
            <a id="created-chat-link" href="#" target="_blank" rel="noopener noreferrer" class="small d-block mb-3"></a>
            <img id="created-chat-qr" alt="QR code for chat link" class="img-fluid rounded border" style="max-width: 220px;"/>
            <div class="mt-3">
                <a id="open-chat-btn" href="#" class="btn btn-outline-primary w-100">Open chat now</a>
            </div>
        </div>
    </div>

    <div class="text-center text-muted mb-4">— or —</div>

    <div class="card shadow-sm">
        <div class="card-body text-center">
            <h2 class="h6 text-uppercase text-muted mb-3">Join an existing chat</h2>
            <form id="join-form" novalidate>
                <input id="join-code-input" type="text" class="form-control form-control-lg text-center text-uppercase mb-3"
                       placeholder="e.g. AYBDC" maxlength="12" autocomplete="off" autocapitalize="characters" required/>
                <button type="submit" class="btn btn-outline-primary btn-lg w-100">Join chat</button>
                <div id="join-error" class="text-danger small mt-2 d-none"></div>
            </form>
        </div>
    </div>
</main>

<div th:replace="~{layout :: scripts}"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
