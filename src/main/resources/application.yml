spring:
  application:
    name: universal-copypaste-api
  datasource:
    url: jdbc:h2:file:./data/copypaste;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

copypaste:
  chat:
    ttl: 24h
    code-length: 5
    cleanup-interval: 15m

server:
  port: 8080

logging:
  level:
    org.lemanoman.copypaste: INFO
